services:
  - type: web
    name: stampworks
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_STORAGE
        value: ./database.sqlite
      - key: CLIENT_ORIGIN
        value: "*"
